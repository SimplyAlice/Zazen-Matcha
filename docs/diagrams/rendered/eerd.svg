<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #2d3a2e; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #556357; }
      .entity-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .field { font-family: "Cascadia Code", Consolas, "Courier New", monospace; font-size: 10.5px; fill: #222222; }
      .pk { font-weight: bold; fill: #134e1e; }
      .fk { font-weight: bold; fill: #0d3c61; }
      .uk { font-weight: bold; fill: #614603; }
      .tag-pk { fill: #d4edda; stroke: #28a745; stroke-width: 0.8; }
      .tag-fk { fill: #cce5ff; stroke: #004085; stroke-width: 0.8; }
      .tag-uk { fill: #fff3cd; stroke: #856404; stroke-width: 0.8; }
      .tag-txt { font-family: sans-serif; font-size: 8px; font-weight: bold; }
      .rel-line { stroke: #2d3a2e; stroke-width: 1.8; fill: none; }
      .rel-label { font-family: sans-serif; font-size: 10px; fill: #2d3a2e; font-weight: 600; background: #ffffff; }
      .card-txt { font-family: sans-serif; font-size: 10.5px; fill: #1b4d24; font-weight: bold; }
      .note-box { fill: #f2f7f3; stroke: #4a5d4e; stroke-width: 1; stroke-dasharray: 4,4; }
      .note-txt { font-family: sans-serif; font-size: 9.5px; fill: #2d3a2e; }
    </style>
    <marker id="crow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 8 5 L 0 10 M 8 0 L 8 10" fill="none" stroke="#2d3a2e" stroke-width="1.5" />
    </marker>
    <marker id="one" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 4 0 L 4 10 M 7 0 L 7 10" fill="none" stroke="#2d3a2e" stroke-width="1.8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="900" fill="#ffffff" />
  <rect x="15" y="15" width="1120" height="870" fill="none" stroke="#e0e6e1" stroke-width="1.5" rx="6" />

  <!-- Diagram Title -->
  <text x="35" y="45" class="title">Zazen Matcha &amp; Tea Co. — Enhanced Entity Relationship Diagram (EERD)</text>
  <text x="35" y="65" class="subtitle">Physical Schema Model: MariaDB 10.4 InnoDB (utf8mb4_unicode_ci) &#8226; 7 Normalized Relational Tables (3NF)</text>

  <!-- ==================== 1. CATEGORIES ==================== -->
  <g transform="translate(40, 95)">
    <rect width="280" height="150" fill="#fbfcfb" stroke="#3d4f3f" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 280 0 L 280 28 L 0 28 Z" fill="#2d3a2e" />
    <text x="12" y="19" class="entity-hdr">CATEGORIES</text>
    <text x="210" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[1 : N Parent]</text>

    <!-- Fields -->
    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">category_id</text>
    <text x="175" y="47" class="field">INT UNSIGNED</text>

    <rect x="10" y="58" width="22" height="12" rx="2" class="tag-uk" />
    <text x="14" y="67" class="tag-txt" fill="#856404">UK</text>
    <text x="38" y="68" class="field uk">name</text>
    <text x="175" y="68" class="field">VARCHAR(100)</text>

    <text x="38" y="89" class="field">description</text>
    <text x="175" y="89" class="field">TEXT NULL</text>

    <text x="38" y="110" class="field">created_at</text>
    <text x="175" y="110" class="field">TIMESTAMP</text>

    <text x="38" y="131" class="field">updated_at</text>
    <text x="175" y="131" class="field">TIMESTAMP</text>
  </g>

  <!-- ==================== 2. PRODUCTS ==================== -->
  <g transform="translate(40, 310)">
    <rect width="300" height="250" fill="#fbfcfb" stroke="#3d4f3f" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 300 0 L 300 28 L 0 28 Z" fill="#2d3a2e" />
    <text x="12" y="19" class="entity-hdr">PRODUCTS</text>
    <text x="200" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[Catalog Master]</text>

    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">product_id</text>
    <text x="180" y="47" class="field">INT UNSIGNED</text>

    <rect x="10" y="58" width="22" height="12" rx="2" class="tag-fk" />
    <text x="14" y="67" class="tag-txt" fill="#004085">FK</text>
    <text x="38" y="68" class="field fk">category_id</text>
    <text x="180" y="68" class="field">INT UNSIGNED</text>

    <text x="38" y="89" class="field">name</text>
    <text x="180" y="89" class="field">VARCHAR(150)</text>

    <text x="38" y="110" class="field">description</text>
    <text x="180" y="110" class="field">TEXT NULL</text>

    <text x="38" y="131" class="field">price</text>
    <text x="180" y="131" class="field">DECIMAL(10,2)</text>

    <text x="38" y="152" class="field">stock_quantity</text>
    <text x="180" y="152" class="field">INT DEFAULT 0</text>

    <text x="38" y="173" class="field">image</text>
    <text x="180" y="173" class="field">VARCHAR(255)</text>

    <text x="38" y="194" class="field">status</text>
    <text x="180" y="194" class="field">ENUM(act,inact)</text>

    <text x="38" y="215" class="field">created_at</text>
    <text x="180" y="215" class="field">TIMESTAMP</text>

    <text x="38" y="236" class="field">updated_at</text>
    <text x="180" y="236" class="field">TIMESTAMP</text>
  </g>

  <!-- ==================== 3. CONTACT_MESSAGES (Standalone) ==================== -->
  <g transform="translate(40, 620)">
    <rect width="300" height="175" fill="#fbfcfb" stroke="#5a6e5c" stroke-width="1.2" rx="4" />
    <path d="M 0 0 L 300 0 L 300 28 L 0 28 Z" fill="#3f5241" />
    <text x="12" y="19" class="entity-hdr">CONTACT_MESSAGES</text>
    <text x="210" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[Standalone]</text>

    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">message_id</text>
    <text x="180" y="47" class="field">INT UNSIGNED</text>

    <text x="38" y="68" class="field">name</text>
    <text x="180" y="68" class="field">VARCHAR(100)</text>

    <text x="38" y="89" class="field">email</text>
    <text x="180" y="89" class="field">VARCHAR(150)</text>

    <text x="38" y="110" class="field">subject</text>
    <text x="180" y="110" class="field">VARCHAR(200)</text>

    <text x="38" y="131" class="field">message</text>
    <text x="180" y="131" class="field">TEXT</text>

    <text x="38" y="152" class="field">created_at</text>
    <text x="180" y="152" class="field">TIMESTAMP</text>
  </g>

  <!-- ==================== 4. CUSTOMERS ==================== -->
  <g transform="translate(440, 95)">
    <rect width="320" height="270" fill="#fbfcfb" stroke="#3d4f3f" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 320 0 L 320 28 L 0 28 Z" fill="#2d3a2e" />
    <text x="12" y="19" class="entity-hdr">CUSTOMERS</text>
    <text x="220" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[Account Directory]</text>

    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">customer_id</text>
    <text x="195" y="47" class="field">INT UNSIGNED</text>

    <text x="38" y="68" class="field">first_name</text>
    <text x="195" y="68" class="field">VARCHAR(100)</text>

    <text x="38" y="89" class="field">last_name</text>
    <text x="195" y="89" class="field">VARCHAR(100)</text>

    <rect x="10" y="100" width="22" height="12" rx="2" class="tag-uk" />
    <text x="14" y="109" class="tag-txt" fill="#856404">UK</text>
    <text x="38" y="110" class="field uk">email</text>
    <text x="195" y="110" class="field">VARCHAR(150)</text>

    <text x="38" y="131" class="field">phone</text>
    <text x="195" y="131" class="field">VARCHAR(30)</text>

    <text x="38" y="152" class="field">password</text>
    <text x="195" y="152" class="field">VARCHAR(255) Hash</text>

    <text x="38" y="173" class="field">address</text>
    <text x="195" y="173" class="field">VARCHAR(255)</text>

    <text x="38" y="194" class="field">city</text>
    <text x="195" y="194" class="field">VARCHAR(100)</text>

    <text x="38" y="215" class="field">province</text>
    <text x="195" y="215" class="field">VARCHAR(100)</text>

    <text x="38" y="236" class="field">postal_code</text>
    <text x="195" y="236" class="field">VARCHAR(20)</text>

    <text x="38" y="257" class="field">created_at / updated_at</text>
    <text x="195" y="257" class="field">TIMESTAMP</text>
  </g>

  <!-- ==================== 5. ORDERS ==================== -->
  <g transform="translate(820, 95)">
    <rect width="290" height="310" fill="#fbfcfb" stroke="#3d4f3f" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 290 0 L 290 28 L 0 28 Z" fill="#2d3a2e" />
    <text x="12" y="19" class="entity-hdr">ORDERS</text>
    <text x="200" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[Sales Journal]</text>

    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">order_id</text>
    <text x="175" y="47" class="field">INT UNSIGNED</text>

    <rect x="10" y="58" width="22" height="12" rx="2" class="tag-fk" />
    <text x="14" y="67" class="tag-txt" fill="#004085">FK</text>
    <text x="38" y="68" class="field fk">customer_id</text>
    <text x="175" y="68" class="field">INT UNSIGNED</text>

    <text x="38" y="89" class="field">order_date</text>
    <text x="175" y="89" class="field">DATETIME</text>

    <text x="38" y="110" class="field">shipping_address</text>
    <text x="175" y="110" class="field">VARCHAR(255)</text>

    <text x="38" y="131" class="field">city, province, zip</text>
    <text x="175" y="131" class="field">VARCHAR</text>

    <text x="38" y="152" class="field">subtotal</text>
    <text x="175" y="152" class="field">DECIMAL(10,2)</text>

    <text x="38" y="173" class="field">shipping_cost</text>
    <text x="175" y="173" class="field">DECIMAL(10,2)</text>

    <text x="38" y="194" class="field">total</text>
    <text x="175" y="194" class="field">DECIMAL(10,2)</text>

    <text x="38" y="215" class="field">payment_method</text>
    <text x="175" y="215" class="field">VARCHAR(50)</text>

    <text x="38" y="236" class="field">payment_status</text>
    <text x="175" y="236" class="field">ENUM(pend,paid)</text>

    <text x="38" y="257" class="field">order_status</text>
    <text x="175" y="257" class="field">ENUM(pend,proc,ship)</text>

    <text x="38" y="278" class="field">created_at</text>
    <text x="175" y="278" class="field">TIMESTAMP</text>

    <text x="38" y="299" class="field">updated_at</text>
    <text x="175" y="299" class="field">TIMESTAMP</text>
  </g>

  <!-- ==================== 6. ORDER_ITEMS ==================== -->
  <g transform="translate(480, 500)">
    <rect width="320" height="195" fill="#fbfcfb" stroke="#3d4f3f" stroke-width="1.5" rx="4" />
    <path d="M 0 0 L 320 0 L 320 28 L 0 28 Z" fill="#2d3a2e" />
    <text x="12" y="19" class="entity-hdr">ORDER_ITEMS</text>
    <text x="210" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[Line Items 3NF]</text>

    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">order_item_id</text>
    <text x="195" y="47" class="field">INT UNSIGNED</text>

    <rect x="10" y="58" width="22" height="12" rx="2" class="tag-fk" />
    <text x="14" y="67" class="tag-txt" fill="#004085">FK</text>
    <text x="38" y="68" class="field fk">order_id</text>
    <text x="195" y="68" class="field">INT UNSIGNED</text>

    <rect x="10" y="79" width="22" height="12" rx="2" class="tag-fk" />
    <text x="14" y="88" class="tag-txt" fill="#004085">FK</text>
    <text x="38" y="89" class="field fk">product_id</text>
    <text x="195" y="89" class="field">INT UNSIGNED</text>

    <text x="38" y="110" class="field">quantity</text>
    <text x="195" y="110" class="field">INT UNSIGNED</text>

    <text x="38" y="131" class="field pk">unit_price (Frozen)</text>
    <text x="195" y="131" class="field">DECIMAL(10,2)</text>

    <text x="38" y="152" class="field">subtotal</text>
    <text x="195" y="152" class="field">DECIMAL(10,2)</text>
  </g>

  <!-- ==================== 7. ADMINS (Standalone) ==================== -->
  <g transform="translate(860, 480)">
    <rect width="250" height="155" fill="#fbfcfb" stroke="#5a6e5c" stroke-width="1.2" rx="4" />
    <path d="M 0 0 L 250 0 L 250 28 L 0 28 Z" fill="#3f5241" />
    <text x="12" y="19" class="entity-hdr">ADMINS</text>
    <text x="170" y="18" font-family="sans-serif" font-size="9" fill="#c4d6c6">[Standalone]</text>

    <rect x="10" y="37" width="22" height="12" rx="2" class="tag-pk" />
    <text x="14" y="46" class="tag-txt" fill="#155724">PK</text>
    <text x="38" y="47" class="field pk">admin_id</text>
    <text x="145" y="47" class="field">INT UNSIGNED</text>

    <text x="38" y="68" class="field">name</text>
    <text x="145" y="68" class="field">VARCHAR(100)</text>

    <rect x="10" y="79" width="22" height="12" rx="2" class="tag-uk" />
    <text x="14" y="88" class="tag-txt" fill="#856404">UK</text>
    <text x="38" y="89" class="field uk">email</text>
    <text x="145" y="89" class="field">VARCHAR(150)</text>

    <text x="38" y="110" class="field">password</text>
    <text x="145" y="110" class="field">VARCHAR(255) Hash</text>

    <text x="38" y="131" class="field">created_at</text>
    <text x="145" y="131" class="field">TIMESTAMP</text>
  </g>

  <!-- ==================== RELATIONSHIP CONNECTORS ==================== -->

  <!-- 1. CATEGORIES (1) to PRODUCTS (0..N) -->
  <path d="M 180 245 L 180 310" class="rel-line" />
  <circle cx="180" cy="250" r="3" fill="#2d3a2e" />
  <path d="M 175 255 L 185 255 M 175 258 L 185 258" stroke="#2d3a2e" stroke-width="1.5" />
  <!-- Crow foot at Products -->
  <path d="M 172 302 L 180 310 L 188 302 M 172 295 L 188 295" stroke="#2d3a2e" stroke-width="1.5" fill="none" />
  <rect x="185" y="265" width="130" height="18" fill="#ffffff" stroke="#c8d1c9" rx="2" />
  <text x="190" y="278" font-family="sans-serif" font-size="9" fill="#1b4d24">fk_products_category (1:N)</text>

  <!-- 2. CUSTOMERS (1) to ORDERS (0..N) -->
  <path d="M 760 210 L 820 210" class="rel-line" />
  <!-- One at Customers -->
  <path d="M 768 204 L 768 216 M 772 204 L 772 216" stroke="#2d3a2e" stroke-width="1.5" />
  <!-- Crow at Orders -->
  <path d="M 812 204 L 820 210 L 812 216 M 808 204 L 808 216" stroke="#2d3a2e" stroke-width="1.5" fill="none" />
  <rect x="762" y="185" width="56" height="16" fill="#ffffff" stroke="#c8d1c9" rx="2" />
  <text x="765" y="197" font-family="sans-serif" font-size="8.5" fill="#1b4d24">places (1:N)</text>

  <!-- 3. ORDERS (1) to ORDER_ITEMS (1..N) -->
  <path d="M 835 405 L 835 550 L 800 550" class="rel-line" />
  <!-- One at Orders -->
  <path d="M 829 415 L 841 415 M 829 419 L 841 419" stroke="#2d3a2e" stroke-width="1.5" />
  <!-- Crow at Order_items -->
  <path d="M 808 544 L 800 550 L 808 556 M 812 544 L 812 556" stroke="#2d3a2e" stroke-width="1.5" fill="none" />
  <rect x="806" y="475" width="50" height="16" fill="#ffffff" stroke="#c8d1c9" rx="2" />
  <text x="809" y="487" font-family="sans-serif" font-size="8.5" fill="#1b4d24">contains</text>

  <!-- 4. PRODUCTS (1) to ORDER_ITEMS (0..N) -->
  <path d="M 340 460 L 480 560" class="rel-line" />
  <!-- One at Products -->
  <path d="M 348 456 L 356 464 M 352 452 L 360 460" stroke="#2d3a2e" stroke-width="1.5" />
  <!-- Crow at Order_items -->
  <path d="M 470 550 L 480 560 L 468 565" stroke="#2d3a2e" stroke-width="1.5" fill="none" />
  <rect x="375" y="505" width="85" height="16" fill="#ffffff" stroke="#c8d1c9" rx="2" />
  <text x="378" y="517" font-family="sans-serif" font-size="8.5" fill="#1b4d24">referenced_in (1:N)</text>

  <!-- ==================== CALLOUT: FINANCIAL IMMUTABILITY ==================== -->
  <g transform="translate(480, 720)">
    <rect width="320" height="75" class="note-box" rx="4" />
    <text x="14" y="20" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#1b4d24">&#8226; Financial Immutability Constraint (3NF)</text>
    <text x="14" y="38" class="note-txt">order_items.unit_price preserves the immutable transaction price</text>
    <text x="14" y="52" class="note-txt">at the exact time of checkout. Subsequent updates to products.price</text>
    <text x="14" y="66" class="note-txt">never alter historical accounting or legal invoice records.</text>
  </g>

  <!-- ==================== LEGEND BOX ==================== -->
  <g transform="translate(850, 680)">
    <rect width="260" height="115" fill="#f8faf8" stroke="#cbd5cc" stroke-width="1" rx="4" />
    <text x="12" y="18" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2d3a2e">Notation &amp; Referential Rules</text>
    <line x1="12" y1="24" x2="248" y2="24" stroke="#d0ded2" stroke-width="1" />

    <rect x="12" y="32" width="18" height="10" rx="2" class="tag-pk" />
    <text x="14" y="40" class="tag-txt" fill="#155724">PK</text>
    <text x="36" y="40" font-family="sans-serif" font-size="9" fill="#333">Primary Key (AUTO_INCREMENT)</text>

    <rect x="12" y="48" width="18" height="10" rx="2" class="tag-fk" />
    <text x="14" y="56" class="tag-txt" fill="#004085">FK</text>
    <text x="36" y="56" font-family="sans-serif" font-size="9" fill="#333">Foreign Key (ON DELETE RESTRICT)</text>

    <rect x="12" y="64" width="18" height="10" rx="2" class="tag-uk" />
    <text x="14" y="72" class="tag-txt" fill="#856404">UK</text>
    <text x="36" y="72" font-family="sans-serif" font-size="9" fill="#333">Unique Key Constraint</text>

    <text x="12" y="90" font-family="sans-serif" font-size="8.5" fill="#555">&#8226; All tables use MariaDB 10.4 InnoDB engine</text>
    <text x="12" y="104" font-family="sans-serif" font-size="8.5" fill="#555">&#8226; Default Collation: utf8mb4_unicode_ci</text>
  </g>

</svg>
